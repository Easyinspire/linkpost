<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Post Link Studio</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#161a23;--mut:#6b7280;--pri:#2563eb;--bd:#e3e6ee}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#eef0f5;--mut:#9aa3b2;--pri:#5b8cff;--bd:#2a3040}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px}h1{font-size:22px}.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=url],input[type=password],select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.up{display:block;text-align:center;padding:22px;border:2px dashed var(--bd);border-radius:12px;color:var(--mut);cursor:pointer}
.sz{display:flex;flex-wrap:wrap;gap:8px}.sz button{padding:8px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px}
.sz button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:600;margin-top:12px}
canvas{width:100%;height:auto;border-radius:10px;border:1px solid var(--bd);margin-top:12px;display:block}
.out{word-break:break-all;background:var(--bg);padding:10px;border-radius:10px;margin-top:8px}.note{font-size:12px;color:var(--mut)}
</style></head><body>
<div class="w" id="lg"><h1>Login</h1><div class="c"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" id="li">Login</button><p class="note" id="le"></p></div></div>
<div class="w" id="main" style="display:none">
<h1>Post Link Studio</h1>
<div class="c"><label class="up" for="f">📷 Tap to upload post image</label><input id="f" type="file" accept="image/*" hidden></div>
<div class="c"><div class="sz" id="sz"></div><canvas id="cv"></canvas>
<label>Button position</label>
<select id="pos"><option value="bar">Bottom bar (image ke neeche patti)</option><option value="br">Bottom right</option><option value="bl">Bottom left</option><option value="bc">Bottom center</option><option value="none">Image par button nahi</option></select></div>
<div class="c">
<label style="margin-top:0">Real URL</label><input id="u" type="url" placeholder="https://example.com/apply">
<label>Button text</label><input id="b" type="text" value="Apply Now"><div class="sz" id="pre" style="margin-top:8px"></div>
<label>Title (Facebook card ka heading)</label><input id="t" type="text">
<button class="btn" id="g">Generate short link</button><div id="res"></div></div>
</div><script>
const SIZES=[["Instagram Post",1080,1080],["Facebook",1200,630],["Instagram Story",1080,1920],["TikTok",1080,1920],["X / Twitter",1600,900],["LinkedIn",1200,627],["YouTube",1280,720],["Pinterest",1000,1500]];
const $=id=>document.getElementById(id);
async function tryLogin(p,auto){const r=await fetch('/api/login',{method:'POST',headers:{'x-admin-password':p}});
 if(r.ok){localStorage.setItem('pw',p);$('lg').style.display='none';$('main').style.display='block';draw();return}
 if(auto)localStorage.removeItem('pw');
 const j=await r.json().catch(()=>({}));$('le').textContent=j.error||'Error'}
$('li').onclick=()=>tryLogin($('pw').value);
$('pw').onkeydown=e=>{if(e.key==='Enter')tryLogin(e.target.value)};
if(localStorage.getItem('pw'))tryLogin(localStorage.getItem('pw'),true);
let img=null,size=0;
$('t').value=localStorage.getItem('title')||'Formexa Pay';
$('t').oninput=()=>localStorage.setItem('title',$('t').value);
SIZES.forEach((s,i)=>{const b=document.createElement("button");b.textContent=`${s[0]} ${s[1]}×${s[2]}`;b.onclick=()=>{size=i;mark();draw()};$("sz").appendChild(b)});
["Apply Now","Open Now","Learn More","Shop Now","Sign Up"].forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{$("b").value=t;draw()};$("pre").appendChild(b)});
const mark=()=>[...$("sz").children].forEach((b,i)=>b.classList.toggle("on",i===size));mark();
$("f").onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{img=i;draw()};i.src=URL.createObjectURL(f)};
$("b").oninput=draw;$("pos").onchange=draw;
function draw(){const cv=$("cv"),[,w,h]=SIZES[size],pos=$("pos").value;cv.width=w;cv.height=h;const x=cv.getContext("2d");
 const bar=pos==="bar"?Math.round(h*.13):0,ih=h-bar;
 x.fillStyle="#222";x.fillRect(0,0,w,h);
 if(img){const r=Math.max(w/img.width,ih/img.height),dw=img.width*r,dh=img.height*r;x.save();x.beginPath();x.rect(0,0,w,ih);x.clip();x.drawImage(img,(w-dw)/2,(ih-dh)/2,dw,dh);x.restore()}
 if(pos==="none")return;
 const t=$("b").value||"Open Now",small=pos!=="bar",fs=Math.round(Math.min(w,h)*(small?.04:.045));
 x.font=`700 ${fs}px sans-serif`;const bw=x.measureText(t).width+fs*2,bh=fs*2.1,m=Math.round(w*.03);
 let bx,by;
 if(pos==="bar"){x.fillStyle="#111827";x.fillRect(0,ih,w,bar);bx=(w-bw)/2;by=ih+(bar-bh)/2}
 else{by=h-bh-m;bx=pos==="br"?w-bw-m:pos==="bl"?m:(w-bw)/2}
 x.fillStyle="#2563eb";x.beginPath();x.roundRect(bx,by,bw,bh,bh/2);x.fill();
 x.fillStyle="#fff";x.textAlign="center";x.textBaseline="middle";x.fillText(t,bx+bw/2,by+bh/2)}
$("g").onclick=async()=>{const url=$("u").value.trim(),res=$("res");
 if(!img){res.innerHTML='<p class="note">Pehle image upload karein.</p>';return}
 if(!/^https?:\/\//i.test(url)){res.innerHTML='<p class="note">Valid URL daalein (https://...)</p>';return}
 res.innerHTML='<p class="note">Bana raha hai…</p>';
 try{const r=await fetch("/api/create",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":localStorage.getItem("pw")||""},
 body:JSON.stringify({url,cta:$("b").value,title:$("t").value,image:$("cv").toDataURL("image/jpeg",.85)})});
 const j=await r.json();if(r.status===401||r.status===429){localStorage.removeItem('pw');location.reload();return}if(!r.ok)throw new Error(j.error);
 res.innerHTML=`<div class="out">${j.short}</div><button class="btn" id="cp">Copy link</button>`;
 $("cp").onclick=()=>navigator.clipboard.writeText(j.short).then(()=>$("cp").textContent="Copied ✓")}
 catch(e){res.innerHTML='<p class="note">Error: '+e.message+'</p>'}};
</script></body></html>
